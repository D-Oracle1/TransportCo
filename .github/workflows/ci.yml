name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transportco_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/transportco_test
      # CI-only secret. Production validation refuses placeholder values.
      JWT_SECRET: ci-only-secret-value-that-is-long-enough-to-pass

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Shared packages compile first — everything else depends on their output.
      - name: Build shared packages
        run: pnpm --filter "./packages/**" build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: Apply migrations
        run: pnpm --filter @transportco/api db:migrate

      - name: Build API
        run: pnpm --filter @transportco/api build

      - name: Build admin console
        run: pnpm --filter @transportco/admin-web build
