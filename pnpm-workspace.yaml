packages:
  - "apps/*"
  - "services/*"
  - "packages/*"

# Hoisted node_modules: Expo/React Native's Metro bundler resolves modules from a
# flat tree. pnpm's default isolated layout hides transitive deps (e.g.
# @babel/runtime, @expo/metro-runtime) from Metro's resolver. pnpm v10+ reads
# these settings from here, not .npmrc.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

# esbuild ships a platform binary and needs its install script to run (vitest
# and tsx depend on it). Every other dependency is installed with scripts
# blocked, so a compromised transitive package cannot execute on install.
allowBuilds:
  esbuild: true
