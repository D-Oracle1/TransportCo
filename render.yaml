# Render blueprint for the PEGO / TransportCo API.
#
# Deploy: push this repo to GitHub, then in Render → New → Blueprint, point it at
# the repo. Render reads this file and creates the service. Set the secret env
# vars (marked `sync: false`) in the Render dashboard afterwards — they are never
# committed here.
#
# IMPORTANT — single instance only. The scheduler and rate limiter are in-process
# (see docs/deployment.md), so two instances would run every background job twice.
# Keep this a single-instance service until they move to Redis.
services:
  - type: web
    name: pego-api
    runtime: node
    # NOTE: the free plan SLEEPS after ~15 min idle — the in-process scheduler
    # (expiring offers, scheduled rides, payment reconciliation) does not run
    # while asleep, and the first request after sleep is a slow cold start. Fine
    # for testing that the apps can reach the API; move to a paid plan (starter)
    # before real operation. A free web service is always a single instance,
    # which is what the in-process scheduler/limiter require anyway.
    plan: free
    region: frankfurt # closest Render region to the Supabase eu-west-1 database
    branch: main
    # Build the shared packages the API depends on, then the API itself. The
    # RN-only `ui` package is intentionally not built here. pnpm is installed
    # directly via npm (pinned to the repo's version) rather than corepack,
    # whose bundled signing keys fail to verify current pnpm releases on Render.
    # Single line on purpose: an indented YAML folded scalar keeps newlines,
    # which would split the `--filter` flags into separate shell commands.
    buildCommand: "npm install -g pnpm@11.20.0 && pnpm install --frozen-lockfile && pnpm --filter @transportco/config --filter @transportco/types --filter @transportco/utils --filter @transportco/validation build && pnpm --filter @transportco/api build"
    # Apply migrations, then start. If a migration fails the service will not
    # start — a bad schema should fail the deploy, not a customer's request.
    startCommand: "node services/api/dist/db/migrate.js up && node services/api/dist/index.js"
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      # NODE_ENV: set to `development` for a staging box (mock payments/maps are
      # allowed, and registration returns devOtp), or `production` once you have
      # real Paystack/Flutterwave + Google Maps keys (production refuses mock
      # providers, a placeholder JWT, or a wildcard CORS origin).
      - key: NODE_ENV
        value: development
      # ── Secrets — set these in the Render dashboard (sync:false keeps them
      #    out of git). See docs/deployment.md for the full checklist. ──
      - key: DATABASE_URL # Supabase SESSION-mode pooler (port 5432), eu-west-1
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET # >= 32 chars, no "change-me"; openssl rand -base64 48
        sync: false
      - key: CORS_ALLOWED_ORIGINS # comma-separated; the admin-web origin(s)
        sync: false
      - key: API_BASE_URL # this service's public URL, e.g. https://pego-api.onrender.com
        sync: false
